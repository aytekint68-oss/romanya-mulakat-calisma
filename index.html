<style>

    --blue: #2563EB;
    --teal: #0D9488;
    --green: #16A34A;
    --amber: #D97706;

  header {

  .brand { display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 1.05rem; }
  .flag {

  }
  .flag span:nth-child(1) { flex: 1; background: #002B7F; }
  .flag span:nth-child(2) { flex: 1; background: #FCD116; }
  .flag span:nth-child(3) { flex: 1; background: #CE1126; }

  .header-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .badge-progress {
    background: var(--slate); padding: 6px 12px; border-radius: 6px; font-size: 0.9rem; font-weight: 600;
  }
  .btn {
    border: none; border-radius: 6px; padding: 8px 14px; font-weight: 600; cursor: pointer;
    font-size: 0.9rem; color: #fff; display: inline-flex; align-items: center; gap: 6px; transition: opacity .15s;
  }
  .btn:hover { opacity: 0.9; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-green { background: var(--green); }
  .btn-blue { background: var(--blue); }
  .btn-teal { background: var(--teal); }
  .btn-amber { background: var(--amber); }
  .btn-gray { background: var(--muted); }
  .btn-red { background: var(--red); }
  .btn-navy { background: var(--navy); }

    background: #E2E8F0; padding: 12px 20px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
  }

  }
  .filters input { flex: 1; min-width: 180px; }

  .container {
    max-width: 1250px; margin: 16px auto; padding: 0 16px;
    display: grid; grid-template-columns: 1.2fr 1fr; gap: 16px;
  }
  @media (max-width: 860px) { .container { grid-template-columns: 1fr; } }

  .panel {
    background: var(--card); border: 1px solid var(--border); border-radius: 8px; overflow: hidden;
  }

  .list-wrapper { max-height: 74vh; overflow-y: auto; }
  .q-item {

    display: flex; justify-content: space-between; align-items: center; gap: 10px;

  .q-item:hover { background: #F8FAFC; }
  .q-item.active { background: #DBEAFE; }
  .q-meta { font-size: 0.78rem; color: var(--muted); margin-bottom: 3px; }
  .q-title { font-weight: 600; font-size: 0.96rem; }

  .st-tekrar { background: #FEF3C7; color: #92400E; }
  .st-ogrenildi { background: #DCFCE7; color: #166534; }

  .cat-tag {

  .ro-text { font-size: 1.15rem; font-weight: 700; margin: 4px 0; }
  .tr-text { font-size: 0.95rem; font-style: italic; color: #475569; margin-bottom: 8px; }
  .divider { border: 0; border-top: 1px solid #E2E8F0; margin: 4px 0; }
  .status-buttons { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .status-bar {
    background: #F8FAFC; border: 1px solid #E2E8F0; padding: 10px 12px; border-radius: 6px;
    font-size: 0.86rem; color: #334155; margin-top: auto;
  }

  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6);
    display: none; align-items: center; justify-content: center; padding: 16px; z-index: 100;

  .modal-backdrop.open { display: flex; }
  .modal {
    background: #fff; width: 100%; max-width: 720px; border-radius: 10px; overflow: hidden;

    background: var(--navy); color: #fff; padding: 14px 18px;

  .exam-input {
    width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 1rem; margin-top: 8px;

</style>
</head>

<header>

let selectedIdx = 0;
let progress = JSON.parse(localStorage.getItem("ro_mulakat_progress") || "{}");
let speakToken = 0;
let currentAudio = null;

function stopAllSpeech() {
  speakToken++;
  if (currentAudio) {
    currentAudio.onended = null;
    currentAudio.onerror = null;
    currentAudio.pause();
    currentAudio.src = "";
    currentAudio = null;
  }
  if ("speechSynthesis" in window) {
    speechSynthesis.cancel();
  }
}

function init() {
  const catSelect = document.getElementById("catFilter");
  const cats = ["Tümü", ...new Set(SORULAR.map(s => s[0]))];
  cats.forEach(c => {
    const opt = document.createElement("option");
    opt.value = c; opt.textContent = c;
    catSelect.appendChild(opt);
  });
  renderList();
  selectQuestion(0);
}

function renderList() {
  const cat = document.getElementById("catFilter").value;
  const st = document.getElementById("statusFilter").value;
  const q = document.getElementById("searchInput").value.trim().toLowerCase();
  const listEl = document.getElementById("questionList");
  listEl.innerHTML = "";

  let learnedCount = 0;
  SORULAR.forEach((item, i) => {
    const status = progress[i] || "Çalışılacak";
    if (status === "Öğrenildi") learnedCount++;

    if (cat !== "Tümü" && item[0] !== cat) return;
    if (st !== "Tümü" && status !== st) return;
    if (q && !item.some(field => field.toLowerCase().includes(q))) return;

    const pillClass = status === "Öğrenildi" ? "st-ogrenildi" : (status === "Tekrar Edilecek" ? "st-tekrar" : "st-calisilacak");
    const div = document.createElement("div");
    div.className = "q-item" + (i === selectedIdx ? " active" : "");
    div.onclick = () => selectQuestion(i);
    div.innerHTML = `
      <div>
        <div class="q-meta">#${i + 1} • ${item[0]}</div>
        <div class="q-title">${item[1]}</div>
      </div>
      <span class="status-pill ${pillClass}">${status}</span>
    `;
    listEl.appendChild(div);
  });

  const pct = Math.round((learnedCount / SORULAR.length) * 100);
  document.getElementById("progressBadge").textContent = `İlerleme: ${learnedCount} / ${SORULAR.length} (%${pct})`;
}

function selectQuestion(idx) {
  selectedIdx = idx;
  const item = SORULAR[idx];
  document.getElementById("detailCat").textContent = `#${idx + 1} • ${item[0]}`;

}

function setStatus(newStatus) {
  progress[selectedIdx] = newStatus;

}

function speakFallbackBrowser(text, token) {
  return new Promise(resolve => {
    if (token !== speakToken || !("speechSynthesis" in window)) return resolve();
    setTimeout(() => {
      if (token !== speakToken) return resolve();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "ro-RO";
      u.rate = 0.95;
      const voices = speechSynthesis.getVoices().filter(v => v.lang.toLowerCase().startsWith("ro"));
      const femaleVoice = voices.find(v => /ioana|alina|female|woman|google/i.test(v.name));
      if (femaleVoice) u.voice = femaleVoice;
      else if (voices[0]) u.voice = voices[0];

      let doneOnce = false;
      const finish = () => {
        if (doneOnce) return;
        doneOnce = true;
        resolve();
      };
      u.onend = finish;
      u.onerror = finish;
      speechSynthesis.speak(u);
    }, 60);
  });
}

function speakPart(text, token) {
  return new Promise(async resolve => {
    if (token !== speakToken) return resolve();

    const isLocalhost = ["localhost", "127.0.0.1"].includes(window.location.hostname);
    const temizBaseUrl = WORKER_URL.replace(/\/+$/, "");
    const url = isLocalhost
      ? `/tts?q=${encodeURIComponent(text)}`
      : `${temizBaseUrl}/?q=${encodeURIComponent(text)}`;

    try {
      const resp = await fetch(url);
      if (!resp.ok) throw new Error("HTTP " + resp.status);
      const blob = await resp.blob();
      if (token !== speakToken) return resolve();

      const blobUrl = URL.createObjectURL(blob);
      const audio = new Audio(blobUrl);
      currentAudio = audio;

      let finished = false;
      const done = () => {
        if (finished) return;
        finished = true;
        URL.revokeObjectURL(blobUrl);
        if (currentAudio === audio) currentAudio = null;
        resolve();
      };

      audio.onended = done;
      audio.onerror = async () => {
        URL.revokeObjectURL(blobUrl);
        await speakFallbackBrowser(text, token);
        done();
      };

      await audio.play();
    } catch (err) {
      console.warn("Worker ses hatası:", err);
      const bar = document.getElementById("statusBar");
      if (bar) bar.textContent = "⚠ Worker hatası (" + err.message + "), yedek ses kullanılıyor.";
      await speakFallbackBrowser(text, token);
      resolve();
    }
  });
}

async function speakTextWithPauses(rawText, statusEl) {
  stopAllSpeech();
  const myToken = speakToken;
  const parts = rawText.split(/\[[^\]]*\]/)
    .map(p => p.replace(/\s+/g, " ").trim())
    .filter(p => /[A-Za-zĂÂÎȘȚăâîșț0-9]/.test(p));

  if (!parts.length) return;
  const preview = parts.join("  [ ... ]  ");
  if (statusEl) statusEl.textContent = `🔊 Okunuyor: ${preview}`;

  for (let i = 0; i < parts.length; i++) {
    if (myToken !== speakToken) return;
    await speakPart(parts[i], myToken);
    if (i < parts.length - 1 && myToken === speakToken) {
      if (statusEl) statusEl.textContent = "⏸  [ Kendi bilginizi söyleyin... ]";
      await new Promise(r => setTimeout(r, 650));
      if (statusEl) statusEl.textContent = `🔊 Okunuyor: ${preview}`;
    }
  }
  if (myToken === speakToken && statusEl) {
    statusEl.textContent = `✔ Tamamlandı: ${preview}`;
  }
}

function speakSelected(type) {
  const item = SORULAR[selectedIdx];
  const text = type === "soru" ? item[1] : item[3];
  speakTextWithPauses(text, document.getElementById("statusBar"));
}

async function startVoiceAnswer() {
  const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRec) {
    alert("Bu tarayıcıda ses tanıma desteklenmiyor. Lütfen Google Chrome veya Microsoft Edge kullanın ya da cevabınızı kutuya yazıp Enter'a basın.");
    return;
  }
  stopAllSpeech();

  const micBtn = document.getElementById("micBtn");
  const micStatus = document.getElementById("micStatus");
  const inputEl = document.getElementById("examAnswerInput");

  if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      stream.getTracks().forEach(track => track.stop());
    } catch (err) {
      micStatus.textContent = "Mikrofon izni reddedildi veya yerel dosya (file://) engeli var. Adres çubuğundan izin verin veya localhost/HTTPS üzerinden açın.";
      micStatus.style.color = "#DC2626";
      return;
    }
  }

  const rec = new SpeechRec();
  rec.lang = "ro-RO";
  rec.interimResults = true;
  rec.continuous = false;
  rec.maxAlternatives = 3;

  let finalTranscript = "";
  let gotResult = false;

  micBtn.disabled = true;
  micBtn.textContent = "🔴 Dinleniyor... Konuşun";
  micStatus.textContent = "Mikrofon açık, Rumence cevabınızı söyleyin...";
  micStatus.style.color = "#DC2626";

  rec.onresult = (e) => {
    gotResult = true;
    let interim = "";
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const text = e.results[i][0].transcript;
      if (e.results[i].isFinal) {
        finalTranscript += text + " ";
      } else {
        interim += text;
      }
    }
    inputEl.value = (finalTranscript + interim).trim();
  };

  rec.onerror = (e) => {
    const mesajlar = {
      "not-allowed": "Mikrofon izni engellendi. Dosya doğrudan (file://) açıldıysa Chrome/Edge yerel dosyada mikrofona izin vermez.",
      "service-not-allowed": "Konuşma servisi engellendi (HTTPS veya localhost üzerinden açmanız gerekir).",
      "no-speech": "Ses duyulmadı. Mikrofona biraz daha yakın konuşup tekrar deneyin.",
      "audio-capture": "Bilgisayarda veya telefonda aktif bir mikrofon bulunamadı.",
      "network": "İnternet bağlantısı hatası (Google ses tanıma için internet gerekir)."
    };
    micStatus.textContent = mesajlar[e.error] || ("Hata: " + e.error);
    micStatus.style.color = "#DC2626";
  };

  rec.onend = () => {
    micBtn.disabled = false;
    micBtn.textContent = "🎙️ Sesli Cevap Ver (Konuş)";
    if (gotResult && inputEl.value.trim()) {
      micStatus.textContent = "✔ Ses algılandı";
      micStatus.style.color = "#16A34A";
      evaluateAnswer();
    }
  };

  try {
    rec.start();
  } catch (err) {
    micBtn.disabled = false;
    micBtn.textContent = "🎙️ Sesli Cevap Ver (Konuş)";
    micStatus.textContent = "Başlatılamadı: " + err.message;
  }
}

function normalizeRo(str) {
  return str.toLowerCase()
    .replace(/[ăâ]/g, "a").replace(/î/g, "i").replace(/[șş]/g, "s").replace(/[țţ]/g, "t")
    .replace(/[^a-z0-9\s]/g, " ").replace(/\s+/g, " ").trim();
}

function evaluateAnswer() {
  const userAns = document.getElementById("examAnswerInput").value.trim();
  if (!userAns) return;
  const cur = examQuestions[examIndex];
  const kNorm = normalizeRo(userAns);
  const kWords = new Set(kNorm.split(" "));

  let bestScore = 0;
  cur.s[3].split("/").forEach(alt => {
    const cleanTemplate = normalizeRo(alt.replace(/\[[^\]]*\]/g, " "));
    const sWords = cleanTemplate.split(" ").filter(Boolean);
    if (!sWords.length) return;
    const matched = sWords.filter(w => kWords.has(w)).length;
    const score = Math.min(100, Math.round((matched / sWords.length) * 100));
    if (score > bestScore) bestScore = score;
  });

  const comment = bestScore >= 80 ? "Mükemmel! Kalıp ve telaffuz son derece doğru."
    : bestScore >= 55 ? "İyi! Ana kalıp doğru, küçük telaffuz farkları var."
    : bestScore >= 30 ? "Kısmen yakın. Örnek cevabı tekrar dinleyip deneyebilirsiniz."
    : "Farklı bir ifade algılandı. Örnek cevabı kontrol edin.";

  const scoreEl = document.getElementById("evalScore");
  scoreEl.textContent = `Uyum Puanı: %${bestScore} — ${comment}`;
  scoreEl.style.color = bestScore >= 75 ? "#16A34A" : (bestScore >= 45 ? "#D97706" : "#DC2626");

  document.getElementById("evalCompare").textContent =
    `Soru: ${cur.s[1]} (${cur.s[2]})\nSizin Cevabınız: ${userAns}\nÖrnek Cevap: ${cur.s[3]} (${cur.s[4]})`;

  examResults[examIndex] = { no: cur.idx + 1, soru: cur.s[1], cevap: userAns, skor: bestScore };
}

function nextExamQuestion() {
  if (!examResults[examIndex]) {
    const cur = examQuestions[examIndex];
    examResults[examIndex] = { no: cur.idx + 1, soru: cur.s[1], cevap: "(Boş geçildi)", skor: 0 };
  }
  if (examIndex + 1 < examQuestions.length) {
    examIndex++;
    renderExamQuestion();
  } else {
    renderExamReport();
  }
}

function renderExamReport() {
  stopAllSpeech();
  const avg = (examResults.reduce((a, b) => a + b.skor, 0) / examResults.length).toFixed(1);
  document.getElementById("examHeaderTitle").textContent = "📊 MÜLAKAT SINAV SONUÇ RAPORU";
  document.getElementById("examBody").innerHTML = `
    <div style="font-size:1.25rem;font-weight:700;color:#1E3A5F;">Genel Başarı Ortalaması: %${avg} (${examResults.length} Soru)</div>
    <div style="color:#475569;font-size:0.92rem;">${avg >= 75 ? "Tebrikler! Konsolosluk mülakatına hazırsınız." : "İyi gidiyorsunuz, düşük puanlı soruları tekrar çalışmanız faydalı olacaktır."}</div>
    <div style="max-height:320px;overflow-y:auto;">
      <table>
        <thead><tr><th>No</th><th>Soru</th><th>Sizin Cevabınız</th><th>Puan</th></tr></thead>
        <tbody>
          ${examResults.map(r => `<tr><td>${r.no}</td><td>${r.soru}</td><td>${r.cevap}</td><td><b>%${r.skor}</b></td></tr>`).join("")}
        </tbody>
      </table>
    </div>
    <div style="display:flex;justify-content:space-between;">
      <button type="button" class="btn btn-blue" onclick="renderExamSetup()">🔄 Yeni Sınav Başlat</button>
      <button type="button" class="btn btn-gray" onclick="closeExamModal()">Kapat</button>
    </div>
  `;
}

if ("speechSynthesis" in window) {
  speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
}
init();
</script>
</body>
</html>
